version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. External Microservice: PhishGuard AI Streamlit App + Database Logging
  # ----------------------------------------------------------------------------
  phishguard_app:
    build: .
    container_name: phishguard_app
    restart: always
    ports:
      - "8501:8501"
    volumes:
      - ./scan_history.db:/app/scan_history.db
    networks:
      - cloud_net

  # ----------------------------------------------------------------------------
  # 2. Nextcloud Database (MariaDB)
  # ----------------------------------------------------------------------------
  nextcloud_db:
    image: mariadb:10.6
    container_name: nextcloud_db
    restart: always
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: root_password_here
      MYSQL_PASSWORD: nextcloud_password_here
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - cloud_net

  # ----------------------------------------------------------------------------
  # 3. Nextcloud Core Service (Cloud Platform Portal)
  # ----------------------------------------------------------------------------
  nextcloud_server:
    image: nextcloud:latest
    container_name: nextcloud_server
    restart: always
    ports:
      - "8080:80"
    links:
      - nextcloud_db
    environment:
      MYSQL_PASSWORD: nextcloud_password_here
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_HOST: nextcloud_db
    volumes:
      - nextcloud_data:/var/html/www
    networks:
      - cloud_net

networks:
  cloud_net:
    driver: bridge

volumes:
  db_data:
  nextcloud_data:
